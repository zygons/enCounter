<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>enCounter — Player Display</title>

    <link rel="icon" type="image/png" href="/assets/branding/favicon.png" />

    <!-- Main application styles -->
    <link rel="stylesheet" href="css/base.css" />

    <!-- Player Display styles -->
    <link rel="stylesheet" href="css/display.css" />

    <!-- Visual Timer styles -->
    <link rel="stylesheet" href="css/timer.css" />
  </head>

  <body class="player-body">
    <!-- =========================================
         ENCOUNTER BACKGROUND
         ========================================= -->

    <div id="displayBackground" class="display-background"></div>

    <!-- Dark overlay placed over encounter backgrounds -->
    <div class="display-shade"></div>

    <!-- =========================================
         PLAYER DISPLAY PRIVACY SCREEN
         ========================================= -->

    <div
      id="playerDisplayPrivacyOverlay"
      class="player-display-privacy-overlay show"
      role="status"
      aria-live="polite"
    >
      <img
        src="/assets/branding/enCounter-logo.png"
        alt="enCounter"
        class="player-display-privacy-logo"
      />

      <div class="player-display-privacy-text">STAND BY</div>
    </div>

    <!-- =========================================
         VISUAL TIMER LAYER

         JavaScript changes the class on this
         container depending on the timer mode:

         Overlay:
           player-timer-overlay

         Featured:
           player-timer-overlay
           timer-mode-featured

         Focus:
           player-timer-focus
           show

         The timer renderer mounts inside
         #playerTimer.
         ========================================= -->

    <div
      id="playerTimerLayer"
      class="player-timer-overlay timer-overlay-hidden"
      aria-hidden="true"
    >
      <div id="playerTimer" aria-label="Active encounter timer"></div>
    </div>

    <!-- =========================================
         PLAYER DISPLAY
         ========================================= -->

    <div class="player-shell">
      <!-- =======================================
           PLAYER HEADER
           ======================================= -->

      <header class="player-header">
        <!-- enCounter branding + encounter information -->

        <div class="player-brand-area">
          <img
            src="/assets/branding/enCounter-logo.png"
            alt="enCounter"
            class="player-logo"
          />

          <div class="player-encounter-info">
            <h1 id="displayEncounterName">New Encounter</h1>

            <span id="displaySystem" class="system-pill"> Generic TTRPG </span>

            <span id="playerAppVersion" class="player-app-version">
              ALPHA · v0.1.0-alpha.1
            </span>

            <span
              id="displayConnectionStatus"
              class="display-connection-status connecting"
              role="status"
              aria-live="polite"
              title="Player Display sync requires the DM Console in the same browser profile."
            >
              DM SYNC: CONNECTING…
            </span>

            <a
              class="player-legal-link"
              href="/docs/LEGAL.html"
              target="_blank"
              rel="noopener"
            >
              MIT · License &amp; Notices
            </a>
          </div>
        </div>

        <!-- Round counter -->

        <div class="display-round">
          <span> ROUND </span>

          <strong id="displayRound"> 1 </strong>
        </div>

        <!-- Full screen button -->

        <button id="fullscreenBtn" type="button">Full Screen</button>
      </header>

      <!-- =======================================
           MAIN PLAYER DISPLAY AREA
           ======================================= -->

      <main class="player-main">
        <!-- =====================================
             BETWEEN-ENCOUNTERS BACKGROUND LOGO

             Displayed when there are no
             combatants in the encounter.
             ===================================== -->

        <div
          id="idleLogoBackdrop"
          class="idle-logo-backdrop"
          aria-hidden="true"
        >
          <img
            src="/assets/branding/enCounter-logo.png"
            alt=""
            class="idle-logo-image"
          />
        </div>

        <!-- =====================================
             CURRENT TURN
             ===================================== -->

        <div class="current-turn">
          <div class="eyebrow">CURRENT TURN</div>

          <h2 id="currentName">Waiting for combat…</h2>
        </div>

        <!-- =====================================
             INITIATIVE TRACK
             ===================================== -->

        <div id="initiativeTrack" class="initiative-track"></div>

        <!-- =====================================
             NEXT TURN
             ===================================== -->

        <div class="next-turn">
          NEXT:

          <strong id="nextName"> — </strong>
        </div>
      </main>
    </div>

    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <!-- Shared configuration / system profiles -->

    <script src="js/core/config.js"></script>

    <!-- IndexedDB access -->

    <script src="js/core/db.js"></script>

    <!-- DM / Player Display synchronization -->

    <script src="js/core/sync.js"></script>

    <!-- Visual Timer Renderer -->

    <script src="js/modules/timer-renderer.js"></script>

    <!-- Visual Timer Engine -->

    <script src="js/modules/timer.js"></script>

    <!-- Player Display Controller -->

    <script src="js/display.js"></script>
  </body>
</html>
