name: Build portable packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ============================================================
  # Run automated JavaScript tests
  # ============================================================
  test:
    name: Run core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run core JavaScript tests
        run: node --test tests/*.test.js


  # ============================================================
  # Build Windows portable package
  # ============================================================
  windows:
    name: Build Windows portable
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows package
        shell: cmd
        run: call "Build enCounter Windows.bat" < NUL

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: enCounter-Windows-Portable
          path: |
            release/*Windows-Portable.zip
            release/*Windows-Portable.sha256.txt
          if-no-files-found: error


  # ============================================================
  # Build Linux portable package
  # ============================================================
  linux:
    name: Build Linux portable
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Build Linux package
        run: |
          chmod +x "Build enCounter Linux.sh"
          ./Build\ enCounter\ Linux.sh

      - name: Upload Linux portable package
        uses: actions/upload-artifact@v7
        with:
          name: enCounter-Linux-Portable
          path: |
            release/*Linux-*.tar.gz
            release/*Linux-*.sha256.txt
          if-no-files-found: error