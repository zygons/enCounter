name: Build portable packages

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ============================================================
  # Run automated JavaScript tests
  # ============================================================

  test:
    name: Run core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run core JavaScript tests
        run: node --test tests/*.test.js


  # ============================================================
  # Build Windows portable package
  #
  # Runs for:
  #   - manual workflow runs
  #   - version tags
  #
  # Does NOT run for pull requests.
  # ============================================================

  windows:
    name: Build Windows portable
    needs: test

    if: github.event_name != 'pull_request'

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows package
        shell: cmd
        run: call "Build enCounter Windows.bat" < NUL

      - name: Verify Windows release files
        shell: powershell
        run: |
          Write-Host "Windows release files:"
          Get-ChildItem release -Recurse

          $zip = Get-ChildItem release -Filter "*Windows-Portable.zip"
          if (-not $zip) {
            Write-Error "Windows portable ZIP was not created."
            exit 1
          }

          $sha = Get-ChildItem release -Filter "*Windows-Portable.sha256.txt"
          if (-not $sha) {
            Write-Error "Windows SHA-256 file was not created."
            exit 1
          }

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: enCounter-Windows-Portable
          path: |
            release/*Windows-Portable.zip
            release/*Windows-Portable.sha256.txt
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # Build Linux portable package
  #
  # Runs for:
  #   - manual workflow runs
  #   - version tags
  #
  # Does NOT run for pull requests.
  # ============================================================

  linux:
    name: Build Linux portable
    needs: test

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Build Linux package
        run: |
          chmod +x "Build enCounter Linux.sh"
          ./Build\ enCounter\ Linux.sh

      - name: Verify Linux release files
        run: |
          echo "Linux release files:"
          find release -maxdepth 2 -type f -print

          if ! compgen -G "release/*Linux-*.tar.gz" > /dev/null; then
            echo "ERROR: Linux tar.gz package was not created."
            exit 1
          fi

          if ! compgen -G "release/*Linux-*.sha256.txt" > /dev/null; then
            echo "ERROR: Linux SHA-256 file was not created."
            exit 1
          fi

      - name: Upload Linux portable package
        uses: actions/upload-artifact@v7
        with:
          name: enCounter-Linux-Portable
          path: |
            release/*Linux-*.tar.gz
            release/*Linux-*.sha256.txt
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # Publish GitHub Release
  #
  # Runs ONLY when a version tag beginning with "v" is pushed.
  # Example:
  #
  #   v0.1.0-alpha.1
  #
  # ============================================================

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - test
      - windows
      - linux

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Windows and Linux packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Display release assets
        run: |
          echo "Release assets:"
          find release-assets -maxdepth 2 -type f -print

          echo "Documentation:"
          find docs -maxdepth 1 -type f -print || true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            docs/enCounter_User_Guide_*.pdf \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "enCounter ${GITHUB_REF_NAME#v}"